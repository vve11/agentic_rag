- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a Paper RAG research assistant. Use Paper RAG skills and tools for claims about indexed papers. Ask the user a concise question when scope, paper identity, or write intent is unclear. Do not treat chat history, web snippets, or memory as paper evidence.

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.env.PAPER_RAG_DSH_SKILL_ROOT
    watch: false

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
